name: Deploy verified main to Dokploy
on:
  workflow_run:
    workflows: ["Verify Next.js build"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dokploy-main
  cancel-in-progress: true
jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Deploy through Dokploy API
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DOKPLOY_URL" || -z "$DOKPLOY_API_KEY" || -z "$DOKPLOY_APPLICATION_ID" ]]; then
            echo "::warning::Dokploy secrets not configured: deploy is not active."
            echo "Configure DOKPLOY_URL, DOKPLOY_API_KEY, DOKPLOY_APPLICATION_ID in Repository Actions Secrets." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          CURRENT_SHA="$(git rev-parse HEAD)"
          if [[ "$EVENT_NAME" == "workflow_run" && "$CURRENT_SHA" != "$VERIFIED_SHA" ]]; then
            echo "Skipping older verified commit because main has changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BASE="$(printf '%s' "$DOKPLOY_URL" | sed 's:/$::')"
          if [[ ! "$BASE" =~ ^https:// ]]; then
            echo "::error::DOKPLOY_URL must be an HTTPS URL."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 50 \
            -X POST "$BASE/api/application.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            --data "{\"applicationId\":\"$DOKPLOY_APPLICATION_ID\"}" > /tmp/dokploy-response.json
          echo "Dokploy deployment requested for verified main $CURRENT_SHA." >> "$GITHUB_STEP_SUMMARY"
