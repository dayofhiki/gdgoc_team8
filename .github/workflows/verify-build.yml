name: Verify Next.js build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Training regression tests
        run: npm run test:training
      - name: Backend PII / LLM / database tests
        run: npm run test:backend
      - name: Setup Deno for Supabase Edge Function check
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate Edge Functions
        run: deno check supabase/functions/chat-turn/index.ts supabase/functions/practice-chat/index.ts
      - name: Next.js production build
        run: npm run build
