name: Verify Next.js build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Training regression tests
        run: npm run test:training
      - name: Backend PII / LLM tests
        run: npm run test:backend
      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions
      - name: Cloud Functions typecheck/build
        run: npm run build --prefix functions
      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Family backend tests (Firestore emulator)
        run: npm run test:firebase
      - name: Next.js production build
        run: npm run build
